    <title>The Niarobian</title>
    <style>
        /* Styling for the header */
        h1 {
            color: darkblue;
            background-color: lightyellow;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        /* Styling for the unordered list */
        ul {
            list-style-type: square;
            margin: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        li{
            float: left;
        }

        ul li {
            margin: 10px 0;
            padding: 5px;
            font-size: 16px;
           text-decoration:none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Hover effect for list items */
        ul li:hover {
            background-color: #d1e7dd;
            color: #0f5132;
            cursor: pointer;
        }

        /* Additional styles for the ordered list (optional) */
        ol {
            margin: 20px;
            padding: 15px;
        }
    </style>
</head>
